name: Publication Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node build.mjs
      - name: Publier site/ sur la branche hostinger-deploy (historique conservé, sans force)
        run: |
          rm -f site/api/*.example.php
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --branch hostinger-deploy --single-branch "$url" /tmp/deploy || { mkdir /tmp/deploy && git -C /tmp/deploy init -q -b hostinger-deploy; }
          find /tmp/deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a site/. /tmp/deploy/
          cd /tmp/deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Aucun changement"; exit 0; }
          git commit -qm "Publication depuis ${GITHUB_SHA::7}"
          git push "$url" hostinger-deploy
